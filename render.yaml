# LightPay backend — Render blueprint
# Deploys the gateway (public) + auth & fiat (private) as Docker services,
# with the existing generis-postgresql-lightpay database in Oregon.
# The lightpay-database environment group must exist in the target environment.
# It supplies DATABASE_URL and Render internal-TLS settings to auth and fiat.
#
# Shared JWT_SECRET comes from the lightpay-authentication environment group.
# Provider secrets (sync:false) are NOT stored in git — set them in the Render dashboard
# after the blueprint is created. See DEPLOY.md for the full go-live checklist.

services:
  # ── API Gateway (public entrypoint) ──────────────────────────────────────
  - type: web
    name: lightpay-gateway
    region: oregon
    runtime: docker
    dockerfilePath: ./services/gateway/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GATEWAY_PORT
        value: "3000"
      - fromGroup: lightpay-authentication
      # Internal service URLs (Render private networking: http://<service>:<port>)
      - key: AUTH_SERVICE_URL
        value: http://lightpay-auth:3001
      - key: FIAT_SERVICE_URL
        value: http://lightpay-fiat:3002
      # Notifications and payment webhooks are provided by fiat.

  # ── Auth service (private) ────────────────────────────────────────────────
  - type: pserv
    name: lightpay-auth
    region: oregon
    runtime: docker
    dockerfilePath: ./services/auth/Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      # Startup applies checked-in migrations before serving requests.
      - key: DB_SYNCHRONIZE
        value: "false"
      - fromGroup: lightpay-authentication
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 30d
      # Reuse the existing database without provisioning a second instance.
      - fromGroup: lightpay-database
      # SMS / email providers (OTP fails closed if unset — set before go-live)
      - key: TERMII_API_KEY
        sync: false
      - key: TERMII_SENDER_ID
        value: LightPay
      - key: SENDGRID_API_KEY
        sync: false
      - key: FROM_EMAIL
        value: noreply@lightpay.ng
      - key: PREMBLY_ENABLED
        value: "false"
      - key: PREMBLY_ENVIRONMENT
        value: live
      - key: PREMBLY_API_FORMAT
        value: current_v1
      - key: PREMBLY_API_KEY
        sync: false
      - key: PREMBLY_APP_ID
        sync: false
      - key: PREMBLY_API_BASE_URL
        sync: false
      - key: PREMBLY_IDENTITY_HASH_KEY
        sync: false

  # ── Fiat service (private) ────────────────────────────────────────────────
  - type: pserv
    name: lightpay-fiat
    region: oregon
    runtime: docker
    dockerfilePath: ./services/fiat/Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: FIAT_PORT
        value: "3002"
      - key: DB_SYNCHRONIZE
        value: "false"          # startup uses checked-in migrations
      - fromGroup: lightpay-authentication
      - key: AUTH_SERVICE_URL
        value: http://lightpay-auth:3001
      # Same existing database and TLS settings as auth.
      - fromGroup: lightpay-database
      # Payment providers (live keys — set in dashboard)
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: VTPASS_API_KEY
        sync: false
      - key: VTPASS_PUBLIC_KEY
        sync: false
      - key: VTPASS_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_ENABLED
        value: "false"
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_ENABLED_COUNTRIES
        value: ""
      - key: FIREBLOCKS_ENABLED
        value: "false"
      - key: FIREBLOCKS_API_KEY
        sync: false
      - key: FIREBLOCKS_SECRET_KEY
        sync: false
      - key: FIREBLOCKS_BASE_PATH
        value: https://api.fireblocks.io/v1
      - key: FIREBLOCKS_ASSET_BTC
        value: BTC
      - key: FIREBLOCKS_ASSET_ETH
        value: ETH
      - key: FIREBLOCKS_ASSET_SOL
        value: SOL
      - key: FIREBLOCKS_ASSET_BNB
        value: BNB_BSC
      - key: EXPO_ACCESS_TOKEN
        sync: false
