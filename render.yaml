# Free backend: auth and fiat bind to loopback; only the gateway port is public.
services:
- type: web
  name: lightpay-backend
  region: oregon
  runtime: docker
  dockerfilePath: ./services/backend/Dockerfile
  dockerContext: .
  plan: free
  healthCheckPath: /api/v1/health
  envVars:
  - fromGroup: lightpay-database
  - fromGroup: lightpay-authentication
  - key: NODE_ENV
    value: production
  - key: DB_SYNCHRONIZE
    value: 'false'
  - key: FLUTTERWAVE_ENABLED
    value: 'false'
  - key: FIREBLOCKS_ENABLED
    value: 'false'
  - key: PREMBLY_ENABLED
    value: 'false'
